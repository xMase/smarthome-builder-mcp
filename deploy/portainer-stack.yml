# Portainer: Stacks -> Add stack -> Web editor -> paste this -> Deploy.
#
# Pulls the published multi-arch image from GHCR (linux/amd64 + linux/arm64) —
# no build on the host. Pin a release with the NRHA_VERSION env var on the stack
# (e.g. NRHA_VERSION=0.1.0); defaults to `latest`.
#
# The GHCR package is private by default: add the registry in Portainer
# (Registries -> add ghcr.io with a GitHub PAT that has read:packages), or run
# `docker login ghcr.io` on the host, before deploying.
services:
  nrha-mcp:
    image: "ghcr.io/xmase/smarthome-builder-mcp:${NRHA_VERSION:-latest}"
    pull_policy: always              # re-pull on redeploy so a new tag is picked up
    environment:
      NR_URL: "http://nodered:1880"   # point at your own Node-RED to skip the test one
      NR_TOKEN: ""
      NR_USER: ""
      NR_PASS: ""
      DEPLOY_MODE: "propose"           # preview-first; set "auto" to deploy without confirm
      MCP_TRANSPORT: "http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
      BACKUP_DIR: "/data/backups"
    ports:
      - "8080:8080"
    volumes:
      - nrha_backups:/data
    restart: unless-stopped
    networks: [nrha]

  # Optional throwaway Node-RED for testing. Delete this service to use your own.
  nodered:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: unless-stopped
    networks: [nrha]

networks:
  nrha:

volumes:
  nrha_backups:
  nodered_data:
